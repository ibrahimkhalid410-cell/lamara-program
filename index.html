<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Lamara · The Climb</title>
<script>try{var t=localStorage.getItem('lamara-theme');if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Light: warm off-white page, white cards, one calm blue accent (blue is the most liked hue, Palmer & Schloss 2010).
   Dark: deep blue-grey, never pure black, text never pure white (less halation for astigmatic eyes). */
:root,[data-theme=light]{
  --bg:#F4F5F7; --card:#FFFFFF; --card2:#F2F4F7; --line:#E5E8EE; --text:#151A22; --mute:#687384;
  --acc:#2F6BFF; --acc2:#8DB3FF; --accs:#EAF1FF; --accink:#FFFFFF;
  --good:#12A26B; --goods:#E3F6EE; --warn:#E07B2E; --warns:#FDF0E5; --gold:#F2A93B; --golds:#FEF4E2;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06); --tab:rgba(255,255,255,.92);
  --scrim:rgba(15,20,27,.45);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0F141B; --card:#171E27; --card2:#1E2631; --line:#28313D; --text:#E6EAF0; --mute:#97A2B2;
  --acc:#6A97FF; --acc2:#3E5FA8; --accs:rgba(106,151,255,.14); --accink:#0F141B;
  --good:#3CC48F; --goods:rgba(60,196,143,.14); --warn:#F0A05A; --warns:rgba(240,160,90,.14); --gold:#F5B94E; --golds:rgba(245,185,78,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --tab:rgba(23,30,39,.92);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{
  /* aliases kept for older markup */
  --sea:var(--bg); --deep:var(--card2); --court:var(--card); --court2:var(--card2); --foam:var(--text); --mist:var(--mute); --tide:var(--acc); --ball:var(--acc);
  --r1:22px; --r2:18px; --r3:12px;
  --disp:'Manrope', 'Inter', system-ui, sans-serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.1}
h2{font-size:28px}
h3{font-size:19px}
p{margin:.4em 0}
.muted{color:var(--mute)}
.small{font-size:13.5px}
.sec{margin-top:24px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:12px}
.card{margin-top:14px}
.lab{font-size:12.5px;font-weight:600;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.btn{border-radius:14px;padding:13px 18px;font-weight:700;background:var(--card2);color:var(--text);border:1px solid var(--line);font-family:var(--disp)}
.btn.primary,.btn.ball{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.block{width:100%;display:block}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:11px}
.btn.big{font-size:17px;padding:16px}
.btn.dim{opacity:.5}
.link{background:none;border:0;color:var(--acc);padding:4px 0;font-weight:600;text-decoration:none}
.why{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  border:1px solid var(--line);background:var(--card2);color:var(--mute);font-size:11.5px;font-weight:700;padding:0;vertical-align:middle;margin-left:6px;flex:none}
input[type=number],input[type=text],input[type=date],input[type=url],select,textarea{
  background:var(--card2);border:1px solid var(--line);border-radius:var(--r3);padding:11px;width:100%;min-width:0;color:var(--text)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px;color:var(--text)}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;background:var(--accs);color:var(--acc);white-space:nowrap}
.pill.good{background:var(--goods);color:var(--good)}
.pill.warn{background:var(--warns);color:var(--warn)}
.pill.gold{background:var(--golds);color:#B87708}
[data-theme=dark] .pill.gold{color:var(--gold)}
.pill.ghost{background:var(--card);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.num{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-variant-numeric:tabular-nums}
.red{color:var(--acc)}
.hidden{display:none!important}

/* ---------- home ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello{font-size:15px;color:var(--mute);font-weight:500}
.name{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.1}
.tgl{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.tgl svg{width:21px;height:21px}
.climb{position:relative;padding:0;overflow:hidden}
.climb canvas{display:block;width:100%;height:300px;touch-action:manipulation}
.climbh{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.climbh>*{pointer-events:auto}
.climbt{font-family:var(--disp);font-weight:800;font-size:18px}
.replay{position:absolute;right:0;top:236px;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.climbf{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.climbf div{padding:10px 8px;text-align:center}
.climbf div+div{border-left:1px solid var(--line)}
.climbf span{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.climbf b{font-family:var(--disp);font-size:17px;font-weight:800}
.target{background:var(--card2);border-radius:var(--r3);padding:10px 12px;margin:12px 0 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.statc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px 8px;box-shadow:var(--shadow);min-width:0}
.statc .lab{font-size:11px}
.statc b{display:block;font-family:var(--disp);font-weight:800;font-size:21px;margin-top:3px;white-space:nowrap}
.statc .spark{display:block;width:100%;height:30px;margin-top:4px}
.rings{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.rings svg{width:132px;height:132px}
.rleg{display:grid;gap:9px}
.rleg div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;border-left:3px solid;padding-left:8px}
.rleg b{font-family:var(--disp);font-weight:800}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wd{border-radius:12px;padding:8px 2px;text-align:center;background:var(--card2);font-size:11.5px;line-height:1.2;color:var(--mute);font-weight:600}
.wd b{display:block;font-family:var(--disp);font-size:16px;font-weight:800;color:var(--text)}
.wd.done{background:var(--acc);color:var(--accink)}
.wd.done b{color:var(--accink)}
.wd.next{box-shadow:inset 0 0 0 2px var(--acc);background:var(--accs);color:var(--acc)}
.coachline{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.av{width:40px;height:40px;border-radius:50%;background:var(--accs);color:var(--acc);font-family:var(--disp);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.cl-from{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:2px}
.cl{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.35;color:var(--text);min-height:2.7em;display:block}
.type::after{content:'';display:inline-block;width:2px;height:1em;background:var(--acc);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flog{display:grid}
.flog .fl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--text)}
.flog .fl:last-child{border-bottom:0}
.flog .ic{width:44px;height:44px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:13px;color:var(--mute)}
.flog .ic.m2{background:var(--accs);color:var(--acc)}
.sig{text-align:center;color:var(--mute);font-size:13px;margin-top:28px}
.sig b{font-family:var(--disp);font-size:17px;color:var(--text);display:block}

/* ---------- dashboard charts ---------- */
canvas.chart{width:100%;height:190px;display:block}
.bigv{white-space:nowrap;font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ch h3{display:flex;align-items:center;gap:8px}
.ch h3 svg{width:18px;height:18px;color:var(--acc)}
.seg{display:flex;gap:4px;background:var(--card2);border-radius:12px;padding:3px;overflow-x:auto}
.seg button{border:0;background:none;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.gauge{display:block;width:100%;max-width:300px;margin:0 auto}
.stack{display:flex;gap:5px;height:34px;margin:12px 0}
.stack i{display:block;border-radius:9px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 6px,rgba(255,255,255,0) 6px 12px)}
.legrow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.legrow span{display:flex;align-items:center;gap:8px}
.sq{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ---------- session ---------- */
.shead{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;margin:-16px 0 4px;border-bottom:1px solid var(--line)}
.shead .t{font-family:var(--disp);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.rec{color:var(--warn)}
.rec::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px;animation:blink 1.2s steps(1) infinite}
.mode{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--accs);color:var(--acc);margin-top:4px}
.exc{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);margin-top:10px;overflow:hidden;box-shadow:var(--shadow)}
.exc.act{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--shadow)}
.exc.fin{opacity:.7}
.exh{display:flex;align-items:center;gap:12px;padding:13px 14px;background:none;border:0;width:100%;text-align:left;color:var(--text)}
.lbl{font-family:var(--disp);font-weight:800;font-size:15px;min-width:38px;height:38px;border-radius:12px;background:var(--accs);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;padding:0 4px}
.exh .nm{font-weight:700;font-size:16px;line-height:1.25}
.exh .st{font-size:13px;color:var(--mute)}
.exb{padding:0 14px 14px}
.fig{width:100%;height:150px;display:block;background:var(--card2);border-radius:var(--r3)}
.figs{width:100%;height:96px}
.cue{font-size:14.5px;margin:10px 0 4px}
.last{font-size:14px;background:var(--card2);border-radius:var(--r3);padding:10px 12px;margin:10px 0}
.last b{color:var(--acc)}
.sets{display:grid;gap:6px;margin-top:6px}
.set{display:grid;grid-template-columns:52px 1fr 1fr 36px;gap:6px;align-items:center}
.set .sn{font-size:13px;color:var(--mute);font-weight:600}
.set input{text-align:center;padding:11px 4px;font-weight:600;font-variant-numeric:tabular-nums}
.set.on .sn{color:var(--acc)}
.set.on input{border-color:var(--acc);background:var(--card)}
.set.dn input{background:transparent;border-color:transparent;color:var(--mute)}
.ok{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:15px;padding:0;color:var(--mute)}
.set.dn .ok{background:var(--good);border-color:var(--good);color:#fff}
.set.on .ok{border-color:var(--acc);color:var(--acc)}
.colh{display:grid;gap:6px;font-size:11.5px;color:var(--mute);text-align:center;font-weight:600;margin-top:4px}
.restc{font-size:12.5px;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.set.rest4{grid-template-columns:44px 1fr 1fr 52px 36px}
.set.rest4.uni{grid-template-columns:44px 1fr 1fr 1fr 48px 36px}
.set.rest4.nw{grid-template-columns:44px 1fr 52px 36px}
.exa{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.rir{margin-top:10px;background:var(--card2);border-radius:var(--r3);padding:10px}
.smart{margin-top:10px;border-radius:var(--r3);padding:10px 12px;background:var(--accs);font-size:14px}
.smart b{color:var(--acc)}
.prep{list-style:none;padding:0;margin:0}
.prep li{margin:8px 0}
.pi{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.tick{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--card2);padding:0;font-size:14px}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.prog{height:8px;background:var(--card2);border-radius:9px;margin:8px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}

/* rest pill */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--text);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.rest .tt{font-family:var(--disp);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.rest button{border:0;border-radius:999px;background:var(--acc);color:var(--accink);padding:8px 14px;font-weight:700}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs .tin{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:480px}
.tabs button{background:none;border:0;color:var(--mute);font-size:11.5px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--acc)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:var(--r1) var(--r1) 0 0;width:100%;max-width:480px;max-height:88vh;overflow:auto;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.sheet.na{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-bottom:8px;font-size:21px}
.sheet .q{margin-top:16px;font-weight:700}
.sheet .q + *{margin-top:8px}

/* toast + celebrations */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--text);color:var(--bg);
  padding:12px 16px;border-radius:14px;max-width:min(440px,calc(100% - 28px));font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:15px}
.toast .from{display:block;font-size:12px;opacity:.7;font-weight:700;margin-bottom:2px}
.pr{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.pr h1{font-size:46px;color:var(--text)}
.pr p{font-size:17px;max-width:320px}
.tele{display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.tele span{font-size:11px;color:var(--mute);font-weight:600}
.tele b{font-family:var(--disp);font-size:18px;font-weight:800}
.grease{stroke-dasharray:1200;stroke-dashoffset:1200;animation:grease .9s .25s cubic-bezier(.6,.1,.3,1) forwards}
@keyframes grease{to{stroke-dashoffset:0}}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12.5px}
.tblw{overflow-x:auto}
table.lt td,table.lt th{text-align:left;vertical-align:top}
.stat{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.stat small{font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--mute);display:block;margin-top:4px;letter-spacing:0}
.mrow{display:grid;grid-template-columns:40px 1fr 96px;gap:10px;align-items:center;margin:8px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.frow{display:grid;grid-template-columns:1fr auto 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.frow b{font-variant-numeric:tabular-nums}
.x{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--mute);padding:0;font-size:12px}
.fbad{border:1px dashed var(--warn);border-radius:var(--r3);padding:8px;margin-top:8px;background:var(--warns)}

/* ---------- marble ---------- */
.marble{background:radial-gradient(70% 60% at 50% 40%,#E9EDF3,#C9D1DD);border-radius:var(--r2);padding:8px 0;border:1px solid var(--line)}
[data-theme=dark] .marble{background:radial-gradient(70% 60% at 50% 40%,#2A3341,#121821)}
.marble svg{display:block;width:100%;height:auto}
.mz{cursor:pointer}
.mz.sel{stroke:var(--acc);stroke-width:1.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;color:var(--mute);font-size:13px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.mrow2{display:grid;grid-template-columns:104px 1fr 46px;gap:10px;align-items:center;padding:9px 0;cursor:pointer;font-size:14.5px;border-bottom:1px solid var(--line)}
.mrow2:last-child{border-bottom:0}
.mrow2 b{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- photos ---------- */

function smoothOpen(p){let d=`M${p[0][0]} ${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
 d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`}return d}
function smoothClosed(p){const n=p.length;let d=`M${p[0][0]} ${p[0][1]}`;for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
 d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`}return d+'Z'}

function leanness(){const ws=weightsSorted();const out=[];const s0=num(S.profile.startW)||CLIENT.weightStart,g=num(S.profile.goal)||CLIENT.goal,now=avg7()??latestW();if(s0>g)out.push(clamp((s0-now)/(s0-g),0,1));
 const ms=S.measures.filter(m=>m.waist).sort((a,b)=>a.d<b.d?-1:1);if(ms.length>1)out.push(clamp((ms[0].waist-ms[ms.length-1].waist)/8,0,1));return out.length?out.reduce((a,b)=>a+b)/out.length:0}
function muscleSets(){const v={};S.sessions.forEach(s=>Object.entries(s.ex||{}).forEach(([id,x])=>{const mm=EXM[id];if(!mm)return;const n=x.s.length;mm[0].forEach(m=>v[m]=(v[m]||0)+n);mm[1].forEach(m=>v[m]=(v[m]||0)+n*.5)}));return v}
function muscleData(){const lean=leanness(),sets=muscleSets(),out={};
 Object.keys(MUSC).forEach(m=>{let gain=null,rows=[];Object.entries(EXM).forEach(([id,mm])=>{if(!mm[0].includes(m))return;const a=firstMetric(id),b=S.best.m[id];if(a&&b){const p=(b-a)/a;rows.push([id,a,b,p])}});if(rows.length){const ps=rows.map(r=>r[3]).sort((a,b)=>b-a).slice(0,3);gain=ps.reduce((a,b)=>a+b)/ps.length}
  const s=gain==null?0:clamp(gain/.8,0,1),v=clamp((sets[m]||0)/160,0,1);const core=['abs','obliques','lowback'].includes(m);
  const prs=S.prs.filter(p=>EXM[p.id]&&EXM[p.id][0].includes(m)).length;const last=S.sessions.slice().reverse().find(z=>Object.keys(z.ex).some(id=>EXM[id]&&EXM[id][0].includes(m)));
  out[m]={gain,s,v,sets:sets[m]||0,lv:S.sessions.length?clamp(core?.25*s+.15*v+.6*lean:.45*s+.25*v+.3*lean,0,1):0,prs,rows:rows.sort((a,b)=>b[3]-a[3]),last}});return{lean,m:out}}

function marbleSVG(D){const lean=D.lean;const tier=l=>l<.34?'b0':l<.67?'b1':'b2';
 const half=(parts,lines,tag)=>{const sil=`<path d="${smoothOpen(OUT)}L100 48Z"/>`;
  const mus=parts.map(([m,p])=>{const d=D.m[m]||{lv:0,prs:0};const path=smoothClosed(p);
   return`<g filter="url(#${tier(d.lv)})"><path d="${path}" fill="url(#shade)" opacity="${(.18+.7*d.lv).toFixed(2)}"/><path d="${path}" fill="none" stroke="#3d3a35" stroke-width="${(.5+.9*d.lv).toFixed(2)}" opacity="${(.25+.65*d.lv).toFixed(2)}"/></g>
   ${d.prs?`<path d="${path}" fill="none" stroke="url(#gold)" stroke-width="1.5" pathLength="100" stroke-dasharray="${Math.min(100,d.prs*14)} 100" stroke-linecap="round"/>`:''}
   <path d="${path}" fill="transparent" class="mz ${MSEL===m?'sel':''}" data-act="marble" data-m="${m}"/>`}).join('');
  const ln=lines.map(p=>`<path d="${smoothOpen(p)}"/>`).join('');
  return{sil,mus,ln}};
 const fig=(parts,lines,ox,lab)=>{const h=half(parts,lines);const mir='matrix(-1 0 0 1 200 0)';
  return`<g transform="translate(${ox},0)"><ellipse cx="100" cy="30" rx="15" ry="19" fill="url(#stone)" filter="url(#tex)"/>

  <g opacity="${(.12+.55*lean).toFixed(2)}" fill="url(#gloss)" style="mix-blend-mode:screen">${[[118,96,12,8],[150,92,7,10],[124,272,8,20],[110,150,5,16]].map(([x,y,rx,ry])=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/><ellipse cx="${200-x}" cy="${y}" rx="${rx}" ry="${ry}"/>`).join('')}</g>
  <text x="100" y="458" text-anchor="middle" fill="#8A93A3" font-size="10" font-weight="600" font-family="Inter, sans-serif">${lab}</text></g>`};
 return`<svg viewBox="0 0 420 466" role="img" aria-label="Marble figure, front and back"><defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F0EA"/><stop offset=".55" stop-color="#E2DED5"/><stop offset="1" stop-color="#BDB7AC"/></linearGradient>

   <feColorMatrix in="n" type="matrix" values="0 0 0 0 .42  0 0 0 0 .40  0 0 0 0 .37  -1.6 0 0 0 .62" result="v"/><feComposite in="v" in2="SourceGraphic" operator="in" result="v2"/>

const UNITW={g:1,gram:1,grams:1,gm:1,gr:1,'جم':1,'جرام':1,kg:1000,ml:1,l:1000,cup:200,cups:200,'كوب':200,glass:240,'كباية':240,tbsp:15,tablespoon:15,tablespoons:15,spoon:15,spoons:15,'معلقة':15,'معالق':15,'معلقه':15,tsp:5,teaspoon:5,teaspoons:5,'معلقة صغيرة':5,

const UNORM={grams:'g',gram:'g',gm:'g',gr:'g','جم':'g','جرام':'g',cups:'cup','كوب':'cup',tablespoon:'tbsp',tablespoons:'tbsp',spoon:'tbsp',spoons:'tbsp','معلقة':'tbsp','معالق':'tbsp','معلقه':'tbsp',teaspoon:'tsp',teaspoons:'tsp',slices:'slice','شريحة':'slice','شرايح':'slice',pieces:'piece',pcs:'piece',pc:'piece','حبة':'piece','حبات':'piece','قطعة':'piece',loaves:'loaf','رغيف':'loaf','ارغفة':'loaf',cans:'can','علبة':'can','طبق':'bowl','كف':'palm','كباية':'glass'};
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,half:.5,quarter:.25,'واحد':1,'واحدة':1,'اتنين':2,'تلاتة':3,'تلات':3,'اربعة':4,'نص':.5,'نصف':.5,'ربع':.25};
function fnorm(t){return t.toLowerCase().replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/½/g,' 0.5 ').replace(/¼/g,' 0.25 ').replace(/¾/g,' 0.75 ').replace(/(\d)\s*\/\s*(\d)/g,(m,a,b)=>' '+(a/b)+' ').replace(/(\d)(g|gm|gr|ml|kg)\b/g,'$1 $2').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return m||n;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function matchFood(t){let best=null,bl=0;FIDX.forEach(f=>f.names.forEach(nm=>{const re=new RegExp('(^|[^a-z\\u0600-\\u06ff])'+nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z\\u0600-\\u06ff])');if(re.test(t)&&nm.length>bl){best=f.i;bl=nm.length}}));
 if(best!=null)return{i:best,sure:1};const words=t.split(' ').filter(w=>w.length>=4&&!UNITW.hasOwnProperty(w));let fb=null,fs=9;
 words.forEach(w=>FIDX.forEach(f=>f.names.forEach(nm=>nm.split(' ').forEach(p=>{if(p.length<4)return;const dd=lev(w,p);if(dd<=Math.max(1,Math.floor(p.length/4))&&dd<fs){fs=dd;fb=f.i}}))));return fb!=null?{i:fb,sure:0}:null}
function suggestFoods(t){const w=fnorm(t).split(' ').filter(x=>x.length>=3);return FIDX.map(f=>({i:f.i,sc:Math.min(...f.names.flatMap(nm=>nm.split(' ').map(p=>Math.min(...w.map(x=>lev(x,p)/Math.max(p.length,1)),9))))})).sort((a,b)=>a.sc-b.sc).slice(0,6).map(x=>x.i)}
function parseChunk(raw){const t=fnorm(raw);if(!t)return null;const tk=t.split(' ');let q=null,unit=null;
 tk.forEach(w=>{const n=parseFloat(w);if(!isNaN(n)&&/^[\d.]+$/.test(w)){q=(q==null?n:q*n)}else if(NUMW[w]!=null&&q==null&&w!=='half'){q=NUMW[w]}else if(w==='half'||w==='نص'){q=(q||1)*.5}else if(UNITW.hasOwnProperty(w)&&!unit)unit=UNORM[w]||w});
 const m=matchFood(t);if(!m)return{raw,ok:0,id:Date.now()+Math.random()};return foodItem(raw,m.i,q,unit,m.sure)}
function foodItem(raw,fi,q,unit,sure){const f=FOODS[fi];const u=f[4]||{};let g;q=q==null?1:q;
 if(unit==='g'||unit==='ml')g=q;else if(unit==='kg'||unit==='l')g=q*1000;else if(unit&&u[unit]!=null)g=q*u[unit];else if(unit&&UNITW[unit])g=q*UNITW[unit];else g=q*f[3];
 return{raw,fi,g:Math.round(g),k:Math.round(g*f[1]/100),p:Math.round(g*f[2]/100*10)/10,ok:1,sure:sure?1:0,id:Date.now()+Math.random()}}
function parseFood(text){text=text.replace(/(tea|coffee) with milk/gi,m=>m.replace(/ with /i,'_w_'));return text.split(/,|\n|\+|،| and | with | مع | و /i).map(x=>x.replace(/_w_/g,' with ').trim()).filter(Boolean).map(parseChunk).filter(Boolean)}
function foodLogHTML(){const t=targets(),d=today(),f=dayFood(d),tot=dayTotals(d),left=t.kcal-tot.k,pct=clamp(tot.k/t.kcal*100,0,100);
 const meals=MEALN.map(m=>{const its=f[m]||[];const mk=its.reduce((a,b)=>a+(b.ok?b.k:0),0);const plan=Math.round(t.kcal*MSPLIT[m]/10)*10;
  const rows=its.map(it=>it.ok?`<div class="frow"><span>${esc(FOODS[it.fi]?FOODS[it.fi][0].split('|')[0]:it.name||it.raw)}<span class="small muted"> ${it.custom?'':it.g+' g'}${it.sure===0?' (best guess: "'+esc(it.raw)+'")':''}</span></span><b>${it.k}</b><button class="x" data-act="fdel" data-m="${m}" data-id="${it.id}" aria-label="Remove">✕</button></div>`
   :`<div class="fbad"><div class="small"><b>Not sure what "${esc(it.raw)}" is.</b> Pick the closest food, or type the calories:</div><div class="row" style="margin-top:6px;gap:6px"><select data-fixsel="${it.id}" data-m="${m}" style="flex:1"><option value="">Choose…</option>${suggestFoods(it.raw).map(i=>`<option value="${i}">${esc(FOODS[i][0].split('|')[0])}</option>`).join('')}<optgroup label="All foods">${FOODS.map((x,i)=>`<option value="${i}">${esc(x[0].split('|')[0])}</option>`).join('')}</optgroup></select><input type="number" inputmode="numeric" placeholder="kcal" data-fixk="${it.id}" style="width:74px"><button class="btn sm" data-act="ffix" data-m="${m}" data-id="${it.id}">OK</button><button class="x" data-act="fdel" data-m="${m}" data-id="${it.id}" aria-label="Remove">✕</button></div></div>`).join('');
  return`<div class="panel" style="margin-top:10px"><div class="row between"><b>${m}</b><span class="small"><b style="color:${mk>plan*1.15?'var(--warn)':'var(--foam)'}">${mk}</b> <span class="muted">/ about ${plan} kcal</span></span></div>${rows}
  <div class="row" style="margin-top:8px;gap:6px"><input type="text" id="fin-${m}" placeholder="What did you eat? e.g. 2 eggs, 1/2 baladi bread" style="flex:1" enterkeyhint="done"><button class="btn sm primary" data-act="fadd" data-m="${m}">Add</button></div>
  <div class="chips" style="margin-top:6px">${(MEALS[m]||[]).map((x,i)=>`<button class="chip" style="font-size:12.5px;padding:5px 10px" data-act="fguide" data-m="${m}" data-i="${i}">+ ${esc(x.n)}</button>`).join('')}</div></div>`}).join('');
 return`<section class="sec"><div class="row between"><h3>Today's food</h3>${whyBtn('foodlog')}</div>
 <div class="panel" style="margin-top:10px;border-color:${left<0?'var(--warn)':'var(--line)'}"><div class="row between"><div class="stat">${tot.k}<small>eaten of ${t.kcal} kcal</small></div><div class="stat" style="text-align:right;color:${left<0?'var(--warn)':'var(--good)'}">${left<0?'+'+(-left):left}<small>${left<0?'kcal over':'kcal left'}</small></div></div>
 <div class="prog" style="margin:10px 0 6px"><i style="width:${pct}%;background:${left<0?'var(--warn)':'var(--good)'}"></i></div>
 <div class="row between small"><span>Protein <b>${Math.round(tot.p)}</b> of ${t.P} g</span><span class="muted">${tot.p>=t.P?'Protein done ✓':Math.max(0,Math.round(t.P-tot.p))+' g protein to go'}</span></div></div>${meals}</section>`}

/* =====================  WHATSAPP SYNC  =====================

const SYNC_KEYS=['food','pace','start','profile','sessions','weights','measures','steps','daily','best','prs','swaps','song'];
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function packData(){const data={};SYNC_KEYS.forEach(k=>{if(S[k]!==undefined)data[k]=S[k]});const json=JSON.stringify({v:1,from:S.coach?'Coach Ibrahim':CLIENT.name,at:Date.now(),data});const raw=new TextEncoder().encode(json);
 if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(raw);w.close();return'z1.'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}catch(e){}}return'j1.'+b64u(raw)}
async function unpackData(code){const[tag,body]=[code.slice(0,3),code.slice(3)];let bytes=unb64u(body);
 if(tag==='z1.'){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}else if(tag!=='j1.')throw new Error('bad');return JSON.parse(new TextDecoder().decode(bytes))}
function pageURL(){return location.origin+location.pathname}
function sendSync(lead){const w=window.open('','_blank');packData().then(code=>{const link=pageURL()+'#sync='+code;
  const msg=(lead?lead+'\n\n':'')+`🔄 Tap to update the page with all the latest numbers:\n${link}`;
  if(msg.length>60000){if(w)w.close();copyText(code);toast('Too much data for one message. The backup code was copied instead.');return}
  const url=(S.coach?'https://wa.me/?text=':'https://wa.me/'+COACH_WA+'?text=')+encodeURIComponent(msg);S.lastSync=Date.now();save();
  if(w)w.location=url;else location.href=url}).catch(()=>{if(w)w.close();toast('Could not build the link. Use the backup code in More.')})}
const skey=s=>s.id||(s.d+'|'+s.day+'|'+s.dur+'|'+Object.keys(s.ex||{}).join(','));
function mergeData(inc){const before=S.sessions.length;const add={sessions:0,weights:0,measures:0};
 if(!S.sessions.length&&inc.start)S.start=inc.start;if(inc.profile&&(inc.profile.t||0)>(S.profile.t||0))S.profile=Object.assign({},S.profile,inc.profile);
 const have=new Set(S.sessions.map(skey));(inc.sessions||[]).forEach(x=>{if(!have.has(skey(x))){S.sessions.push(x);add.sessions++}});S.sessions.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
 (inc.weights||[]).forEach(x=>{const i=S.weights.findIndex(y=>y.d===x.d);if(i<0){S.weights.push(x);add.weights++}else if((x.t||0)>(S.weights[i].t||0)&&x.kg!==S.weights[i].kg){S.weights[i]=x;add.weights++}});
 (inc.measures||[]).forEach(x=>{const i=S.measures.findIndex(y=>y.d===x.d);if(i<0){S.measures.push(x);add.measures++}else{const a=S.measures[i],newer=(x.t||0)>(a.t||0);Object.keys(x).forEach(k=>{if(a[k]==null||(newer&&x[k]!=null))a[k]=x[k]})}});S.measures.sort((a,b)=>a.d<b.d?-1:1);
 Object.entries(inc.steps||{}).forEach(([d,v])=>{if(S.steps[d]==null||num(v)>num(S.steps[d]))S.steps[d]=v});
 S.food=S.food||{};Object.entries(inc.food||{}).forEach(([d,day])=>{const a=S.food[d]=S.food[d]||{};Object.entries(day).forEach(([m,its])=>{const ids=new Set((a[m]||[]).map(x=>String(x.id)));a[m]=(a[m]||[]).concat(its.filter(x=>!ids.has(String(x.id))))})});if(S.pace==null&&inc.pace!=null)S.pace=inc.pace;
 Object.entries(inc.daily||{}).forEach(([d,h])=>{const a=S.daily[d]=S.daily[d]||{};Object.entries(h).forEach(([k,v])=>{if(k==='stress'){if(a.stress==null)a.stress=v}else if(v)a[k]=v})});
 const pk=new Set(S.prs.map(p=>p.d+p.txt));(inc.prs||[]).forEach(p=>{if(!pk.has(p.d+p.txt))S.prs.push(p)});S.prs.sort((a,b)=>a.d<b.d?-1:1);
 Object.entries(inc.swaps||{}).forEach(([k,v])=>{if(!S.swaps[k])S.swaps[k]=v});
 const b=inc.best||{};Object.entries(b.m||{}).forEach(([k,v])=>{if(S.best.m[k]==null||v>S.best.m[k])S.best.m[k]=v});
 if(!S.song&&inc.song)S.song=inc.song;
 rebuildBest();S.lastSync=Date.now();save();return add}

/* =====================  ROUTER + EVENTS  ===================== */
function keepY(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function renderTab(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
 ({today:renderToday,marble:renderMarble,print:renderPrint,food:renderFood,more:renderMore})[TAB]();setupCanvases();startType()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if($('#cam'))stopCam();TAB=b.dataset.tab;renderTab();window.scrollTo(0,0)});
$('#restSkip').addEventListener('click',()=>{clearInterval(restI);$('#rest').classList.add('hidden')});
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-tab-go]');if(go){TAB=go.dataset.tabGo;renderTab();window.scrollTo(0,0);return}
 const ci=e.target.closest('[data-ci]');if(ci){CI[ci.dataset.ci]=ci.dataset.v;const y=$('.sheet').scrollTop;drawCheckin();$('.sheet').scrollTop=y;return}
 const fi=e.target.closest('[data-fin]');if(fi){FIN[fi.dataset.fin]=fi.dataset.v;const y=$('.sheet').scrollTop;drawFinish();$('.sheet').scrollTop=y;return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.k!=null&&/^\d+$/.test(b.dataset.k)?+b.dataset.k:null;
 switch(a){
 case'theme':toggleTheme();break;
 case'replay':drawClimb(true);break;
 case'plift':PLIFT=b.dataset.v;keepY(renderPrint);break;
 case'why':e.stopPropagation();showWhy(b.dataset.k);break;
 case'close':closeSheet();break;
 case'checkin':{const d=b.dataset.day,sh=!!b.dataset.short;if(S.live){askConfirm('Start a new workout?',`${DAYS[S.live.day].n} is still open. Starting a new one cancels it.`,'Start new',()=>{S.live=null;PAUSE=false;save();openCheckin(d,sh)})}else openCheckin(d,sh);break}
 case'go':if(CI.energy&&CI.sleep)startSession();break;
 case'chat':wa('Hi Coach Ibrahim! ');break;
 case'daily':{const w=num($('#qw').value),s=num($('#qs').value);if(w==null&&s==null){toast('Enter your weight or steps.');break}if(w!=null){if(w<40||w>250){toast('Enter your weight in kg.');break}S.weights=S.weights.filter(x=>x.d!==today());S.weights.push({d:today(),kg:w,t:Date.now()})}if(s!=null)S.steps[today()]=s;save();renderToday();toast('Saved.');break}
 case'tick':{const i=+b.dataset.i,L=S.live;L.prep=L.prep.includes(i)?L.prep.filter(x=>x!==i):L.prep.concat(i);save();keepY(renderSession);break}
 case'open':{const L=S.live;L.open=L.open===k?null:k;save();keepY(renderSession);break}
 case'ok':completeSet(k,+b.dataset.i);break;
 case'rir':{S.live.log[k].rir=+b.dataset.v;save();keepY(renderSession);break}
 case'swap':openSwap(k);break;
 case'doswap':doSwap(+b.dataset.k,b.dataset.id);break;
 case'usepick':{const L=S.live;L.log[k].sets.forEach(z=>{if(!z.d)z.w=b.dataset.w});save();keepY(renderSession);toast('Set to '+b.dataset.w+' kg. Own it.','Coach Ibrahim');break}
 case'note':{const L=S.live,x=L.list.find(y=>y.k===k),lg=L.log[k];const t=document.querySelector(`[data-note="${k}"]`).value;lg.note=t;save();
  wa(`💬 Lamara, note on ${EX[x.id].n} (${DAYS[L.day].n}, ${nice(today())}):\n${t}\nSets so far: ${lg.sets.filter(s=>s.d).map(s=>setTxt(EX[x.id],s)).join(', ')||'none'}`);break}
 case'finish':openFinish();break;
 case'abandon':askConfirm('Cancel this workout?','Sets logged in this session will not be saved.','Cancel workout',()=>{S.live=null;PAUSE=false;save();clearInterval(timerI);$('#rest').classList.add('hidden');renderTab();window.scrollTo(0,0)});break;
 case'cfyes':{const f=CONFIRM_FN;CONFIRM_FN=null;closeSheet();f&&f();break}
 case'pause':PAUSE=true;clearInterval(timerI);renderTab();window.scrollTo(0,0);break;
 case'resume':PAUSE=false;renderTab();window.scrollTo(0,0);break;
 case'savesend':saveSession(true);break;
 case'saveonly':saveSession(false);break;
 case'prclose':b.closest('.pr').remove();break;
 case'flight':showFlight(b.dataset.id);break;
 case'morelog':FLOGN+=12;keepY(renderToday);break;
 case'marble':MSEL=MSEL===b.dataset.m?null:b.dataset.m;keepY(renderMarble);break;
 case'logw':{const w=num($('#bw').value);if(w==null||w<40||w>250){toast('Enter your weight in kg.');return}S.weights=S.weights.filter(x=>x.d!==today());S.weights.push({d:today(),kg:w,t:Date.now()});save();keepY(renderMarble);toast('Logged. The 7-day average is what counts.');break}
 case'savem':{const m={d:$('#md').value||today()};let any=0;MFIELDS.forEach(([f])=>{const v=num($('#m_'+f).value);if(v!=null&&v>10&&v<250){m[f]=v;any=1}});if(!any){toast('Enter at least one measurement in cm.');return}
  m.t=Date.now();const i=S.measures.findIndex(x=>x.d===m.d);if(i>=0)Object.assign(S.measures[i],m);else S.measures.push(m);S.measures.sort((a,b)=>a.d<b.d?-1:1);save();keepY(renderMarble);const bf=bodyFatNow();toast(bf?`Saved. Body fat about ${bf.v.toFixed(1)}%.`:'Measurements saved.');break}
 case'prmore':PRWN=999;keepY(renderPrint);break;
 case'ppose':PPOSE=b.dataset.v;keepY(renderPrint);break;
 case'pcam':openCam();break;
 case'pup':pickFile(false);break;
 case'pdip':saveDiptych();break;
 case'pdel':delPhoto(b.dataset.id);break;
 case'phpose':PHPEND.pose=b.dataset.v;drawPhotoMeta();break;
 case'phsave':savePending();break;
 case'camclose':stopCam();break;
 case'snap':snap();break;
 case'camtimer':CAMT=CAMT===0?5:CAMT===5?10:0;b.textContent='⏱ '+(CAMT?CAMT+'s':'off');break;
 case'camflip':CAMF=CAMF==='user'?'environment':'user';stopCam();openCam();break;
 case'camghost':CAMG=CAMG?0:1;stopCam();openCam();break;
 case'pace':S.pace=+b.dataset.v;save();keepY(renderFood);toast(`Target updated: ${targets().kcal.toLocaleString()} kcal.`);break;
 case'mtab':MTAB=b.dataset.v;keepY(renderFood);break;
 case'fadd':{const m=b.dataset.m,inp=$('#fin-'+m),v=inp.value.trim();if(!v){inp.focus();return}const its=parseFood(v);addFoodItems(m,its);keepY(renderFood);
  const bad=its.filter(x=>!x.ok).length;toast(bad?`${its.length-bad} added. ${bad} need a quick pick below.`:`Added ${its.reduce((a,x)=>a+x.k,0)} kcal. ${Math.max(0,targets().kcal-dayTotals(today()).k)} left today.`);break}
 case'fguide':{const m=b.dataset.m,x=MEALS[m][+b.dataset.i];addFoodItems(m,[{raw:x.n,name:x.n,custom:1,k:x.k,p:x.p,g:0,ok:1,id:Date.now()+Math.random()}]);keepY(renderFood);toast(`${x.n}: ${x.k} kcal added.`);break}
 case'fdel':{const m=b.dataset.m,f=dayFood(today());f[m]=(f[m]||[]).filter(x=>String(x.id)!==b.dataset.id);save();keepY(renderFood);break}
 case'ffix':{const m=b.dataset.m,f=dayFood(today()),arr=f[m]||[],ix=arr.findIndex(x=>String(x.id)===b.dataset.id);if(ix<0)break;const it=arr[ix];const sel=document.querySelector(`[data-fixsel="${b.dataset.id}"]`).value,kk=num(document.querySelector(`[data-fixk="${b.dataset.id}"]`).value);
  if(kk!=null){arr[ix]={raw:it.raw,name:it.raw,custom:1,k:Math.round(kk),p:0,g:0,ok:1,id:it.id}}else if(sel!==''){const t=fnorm(it.raw);let q=null,unit=null;t.split(' ').forEach(w=>{const n=parseFloat(w);if(!isNaN(n)&&/^[\d.]+$/.test(w))q=n;else if(UNITW.hasOwnProperty(w)&&!unit)unit=UNORM[w]||w});arr[ix]=foodItem(it.raw,+sel,q,unit,1)}else{toast('Pick a food or type the calories.');break}
  save();keepY(renderFood);break}
 case'syncyes':{const a2=mergeData(window.__pkg.data||{});history.replaceState(null,'',pageURL());closeSheet();TAB='today';renderTab();toast(`Updated: ${a2.sessions} new workout${a2.sessions===1?'':'s'}, ${a2.weights} weigh-in${a2.weights===1?'':'s'}.`,S.coach?'Sync':'Coach Ibrahim');break}
 case'syncno':history.replaceState(null,'',pageURL());closeSheet();break;
 case'syncsend':sendSync(S.coach?'Your latest numbers, updated 💪':'My latest numbers 💪');break;
 case'coachmode':S.coach=!S.coach;save();renderMore();toast(S.coach?'Coach mode on for this phone.':'Coach mode off.');break;
 case'rep':wa(report(+b.dataset.n));break;
 case'savesong':S.song=$('#song').value.trim();save();toast('Power song saved.');break;
 case'saveprof':saveProfile();break;
 case'backup':copyText(backupCode()).then(()=>toast('Backup code copied. Keep it in your notes.'));break;
 case'restore':{const v=$('#restore').value.trim();if(v.includes('#sync=')||/^[zj]1\./.test(v)){const code=v.includes('#sync=')?v.split('#sync=')[1].split(/\s/)[0]:v;location.hash='sync='+code;checkIncoming();break}
  try{const o=JSON.parse(decodeURIComponent(escape(atob(v.replace(/^LAM1:/,'')))));if(!o||!Array.isArray(o.sessions))throw 0;S=Object.assign(fresh(),o);S.seeded=1;save();TAB='today';renderTab();toast('Restored.')}catch(err){toast('That code did not work. Copy the whole code and try again.')}break}
 }});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;
 if(t.id&&t.id.startsWith('fin-')){e.preventDefault();document.querySelector(`[data-act=fadd][data-m="${t.id.slice(4)}"]`).click();return}
 if(t.matches('.set input')){e.preventDefault();t.blur()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='phfile'){onPhotoFile(t.files&&t.files[0]);return}
 if(!t.matches('.set input')||!S.live)return;const k=+t.dataset.k,i=+t.dataset.i,f=t.dataset.f;const L=S.live,s=L.log[k].sets[i];s[f]=t.value.trim();save();
 const x=L.list.find(y=>y.k===k),ex=EX[x.id];if(s.d)return;
 if(f!=='w'&&setFilled(ex,s)&&(ex.bw||num(s.w)>0)){completeSet(k,i);return}
 if(f==='l'){const r=t.parentElement.querySelector('[data-f="rt"]');r&&r.focus()}
 if(f==='w'){const r=t.parentElement.querySelector('[data-f="r"],[data-f="l"]');r&&r.focus()}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-note]')&&S.live){S.live.log[+t.dataset.note].note=t.value;save()}});
let RZ,RZW=window.innerWidth;window.addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(()=>{if(window.innerWidth===RZW)return;RZW=window.innerWidth;if(TAB==='today'){drawClimb(false);drawSparks()}if(TAB==='print')renderPrint();if(TAB==='marble')drawWeightChart()},200)});

/* =====================  BOOT  ===================== */
load();save();renderTab();checkIncoming();window.addEventListener('hashchange',checkIncoming);

</script>
</body>
</html>
